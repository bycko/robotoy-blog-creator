<div class="rt-product-card" style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:24px 0;padding:16px;border:1px solid #e5e5e5;border-radius:12px;">
  <a href="[[product_path]]" style="flex:0 0 160px;max-width:100%;"><img src="[[photo_url]]" alt="[[photo_alt]]" width="160" height="160" loading="lazy" style="display:block;width:100%;height:auto;object-fit:contain;border-radius:8px;"></a>
  <div style="flex:1 1 220px;min-width:0;">
    <p style="margin:0 0 8px;font-weight:bold;"><a href="[[product_path]]">[[product_name]]</a></p>
    <ul style="margin:0 0 12px;padding-left:20px;">
      <li>[[label_pieces]]: [[pieces]]</li>
      <li>[[label_assembly_time]]: [[assembly_time]]</li>
      <li>[[label_difficulty]]: [[difficulty]]</li>
    </ul>
    <p style="margin:0;"><a href="[[product_path]]">[[label_link]]</a></p>
  </div>
</div>
