<div class="rt-product-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin:24px 0;">
[[items]]
  <div class="rt-product-grid-item" style="display:flex;flex-direction:column;padding:12px;border:1px solid #e5e5e5;border-radius:12px;">
    <a href="[[product_path]]"><img src="[[photo_url]]" alt="[[photo_alt]]" width="240" height="240" loading="lazy" style="display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:contain;border-radius:8px;"></a>
    <p style="margin:8px 0;font-weight:bold;"><a href="[[product_path]]">[[product_name]]</a></p>
    <ul style="margin:0 0 8px;padding-left:18px;font-size:14px;">
      <li>[[label_pieces]]: [[pieces]]</li>
      <li>[[label_assembly_time]]: [[assembly_time]]</li>
      <li>[[label_difficulty]]: [[difficulty]]</li>
    </ul>
    <p style="margin:auto 0 0;"><a href="[[product_path]]">[[label_link]]</a></p>
  </div>
[[/items]]
</div>
